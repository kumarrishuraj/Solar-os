<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SolarOS — Solar Operations Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --canvas:#F1F2EF;--card:#FFFFFF;--hero:#C5D1C5;--hero-soft:#D5DED3;
  --sb:#292C29;--sb-acc:#3B423A;--sb-fg:#B9BFB7;
  --forest:#55764D;--forest-d:#46633F;--lime:#A8CE45;--lime-soft:#EEF5DA;
  --sage:#829B83;--sage-soft:#E7ECE6;--ink:#252925;--muted:#858B84;
  --border:#E7E9E4;--track:#ECEEE9;
  --success:#5B9B64;--success-soft:#E5F0E6;--warning:#D9A441;--warning-soft:#F8EFDB;
  --danger:#C96B61;--danger-soft:#F6E5E2;
  --shadow:0 1px 2px rgba(37,41,37,.04),0 2px 12px -4px rgba(37,41,37,.07);
  --pop:0 16px 40px -14px rgba(37,41,37,.28),0 2px 6px rgba(37,41,37,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Geist,Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--canvas);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* ---------- shell ---------- */
.sb{position:fixed;inset:0 auto 0 0;width:84px;background:var(--sb);color:var(--sb-fg);display:flex;flex-direction:column;z-index:40;transition:width .2s ease,transform .2s ease}
.sb.open{width:244px}
.main{margin-left:84px;min-width:0;transition:margin .2s ease}
body.sb-open .main{margin-left:244px}
.sb-top{height:68px;display:flex;align-items:center;gap:11px;padding:0 22px;flex-shrink:0}
.logo{width:40px;height:40px;flex-shrink:0;display:block}
.brand{font-weight:600;font-size:17px;color:#fff;letter-spacing:-.015em;white-space:nowrap;display:none}
.brand b{color:var(--lime);font-weight:600}
.sb.open .brand{display:block}
.nav{flex:1;overflow-y:auto;padding:4px 14px 10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(185,191,183,.5);padding:14px 10px 6px;white-space:nowrap;display:none}
.sb.open .grp{display:block}
.sep{height:1px;background:rgba(255,255,255,.07);margin:8px 12px}
.sb.open .sep{display:none}
.nv{position:relative;display:flex;align-items:center;gap:12px;height:40px;border-radius:10px;padding:0 15px;color:var(--sb-fg);white-space:nowrap;transition:background .15s,color .15s;width:100%;text-align:left}
.nv:hover{background:rgba(59,66,58,.6);color:#fff}
.nv.act{background:var(--sb-acc);color:#fff}
.nv.act::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--lime)}
.nv span{display:none;font-size:13.5px}
.sb.open .nv span{display:inline}
.sb-bot{padding:10px 14px 16px;border-top:1px solid rgba(255,255,255,.07);display:grid;gap:4px}
.me{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:10px}
.me .who{display:none;min-width:0}
.sb.open .me .who{display:block}
.me .who b{display:block;color:#fff;font-weight:500;font-size:13px}
.me .who small{font-size:11.5px;color:var(--sb-fg)}
.tip{position:fixed;z-index:90;background:var(--sb);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;pointer-events:none;box-shadow:var(--pop);white-space:nowrap;display:none}
.top{height:68px;display:flex;align-items:center;gap:10px;padding:0 28px;position:sticky;top:0;background:rgba(241,242,239,.9);backdrop-filter:blur(6px);z-index:30}
.crumb{font-size:13px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.crumb b{color:var(--ink);font-weight:500}
.search{position:relative;flex:1;max-width:460px;margin-left:auto}
.search .box{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;background:#fff;border:1px solid var(--border);border-radius:10px;color:var(--muted)}
.search input{border:0;outline:0;flex:1;background:transparent;color:var(--ink);min-width:0}
.kbd{font-size:11px;border:1px solid var(--border);border-radius:6px;padding:1px 6px;color:var(--muted)}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#fff;border:1px solid var(--border);color:var(--ink);position:relative;flex-shrink:0}
.ib:hover{background:#F7F8F5}
.cnt{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 5px;border:2px solid var(--canvas)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;font-weight:500;font-size:13.5px;transition:background .15s;white-space:nowrap}
.btn svg.i{width:16px;height:16px}
.btn-p{background:var(--forest);color:#fff}.btn-p:hover{background:var(--forest-d)}
.btn-o{background:#fff;border:1px solid var(--border)}.btn-o:hover{background:#F6F7F4}
.btn-l{background:var(--lime);color:var(--ink)}.btn-l:hover{filter:brightness(.97)}
.btn-g{color:var(--forest)}.btn-g:hover{background:var(--sage-soft)}
.btn-d{background:var(--danger-soft);color:#A4483F}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.av{width:36px;height:36px;border-radius:50%;background:var(--sage-soft);color:var(--forest);display:grid;place-items:center;font-weight:600;font-size:12.5px;flex-shrink:0}
.sb .av{background:#3B423A;color:var(--lime)}
.pop{position:absolute;top:46px;right:0;width:380px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--pop);padding:8px;z-index:50}
.pop h4{font-size:13.5px;font-weight:500;padding:8px 10px;display:flex;justify-content:space-between;align-items:center}
.rel{position:relative}
.page{padding:6px 28px 48px;max-width:1600px;margin:0 auto}
/* ---------- primitives ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:20px;min-width:0}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ch .grow{flex:1;min-width:0}
.ct{font-size:15px;font-weight:500;letter-spacing:-.01em}
.cd{font-size:12.5px;color:var(--muted)}
.tile{width:32px;height:32px;border-radius:9px;background:var(--sage-soft);color:var(--forest);display:grid;place-items:center;flex-shrink:0}
.tile svg.i{width:16px;height:16px}
.lbl{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:500;padding:2px 7px;border-radius:999px}
.up{background:var(--success-soft);color:#3F7A48}.down{background:var(--danger-soft);color:#A4483F}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-success{background:var(--success-soft);color:#3F7A48}.b-warning{background:var(--warning-soft);color:#946A1B}
.b-danger{background:var(--danger-soft);color:#A4483F}.b-forest{background:#E2EADF;color:var(--forest-d)}
.b-lime{background:var(--lime-soft);color:#5A7613}.b-neutral{background:var(--track);color:#5E645D}.b-sage{background:var(--sage-soft);color:var(--forest)}
.demo{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--sage-soft);color:var(--forest);white-space:nowrap}
.demo::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lime)}
.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--forest);transition:width .4s ease}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid #EEF0EB;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover td{background:#F7F8F5}
.tbl tr.click{cursor:pointer}
.tw{overflow-x:auto;margin:0 -20px;padding:0 6px}
.r{text-align:right!important}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:10px 0 20px}
.ph h1{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.ph p{color:var(--muted);margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tool{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.inp{height:38px;border:1px solid #E1E4DE;border-radius:10px;padding:0 12px;background:#fff;outline:0;width:100%;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:rgba(85,118,77,.55);box-shadow:0 0 0 3px rgba(85,118,77,.14)}
textarea.inp{height:auto;padding:10px 12px;resize:vertical}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:500}
.err{font-size:12px;color:var(--danger);min-height:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px;font-size:12.5px;color:var(--muted)}
/* ---------- hero ---------- */
.hero{background:var(--hero);border-radius:22px;padding:26px 30px 24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:12px;position:relative;overflow:hidden;margin-bottom:18px}
.hero .bc{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#4E594D;background:rgba(255,255,255,.45);padding:4px 10px;border-radius:999px}
.hero h1{font-size:31px;line-height:1.12;font-weight:600;letter-spacing:-.005em;margin:16px 0 10px;text-transform:uppercase;max-width:520px}
.hero p.sub{color:#4A5449;max-width:440px;font-size:14.5px}
.hw{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px;max-width:540px}
.wg{background:rgba(255,255,255,.78);border-radius:16px;padding:16px;border:1px solid rgba(255,255,255,.7)}
.illu{position:relative;min-height:300px;display:flex;align-items:center}
.illu svg{width:100%;height:auto;max-height:350px;display:block}
.kpis{position:absolute;bottom:2px;right:6px;display:flex;gap:10px}
.kpi{background:#fff;border-radius:14px;padding:10px 14px;box-shadow:var(--pop);display:flex;align-items:center;gap:10px}
.kpi .tile{width:34px;height:34px}
.mb{display:grid;gap:7px;margin-top:10px}
.mb div{display:grid;grid-template-columns:86px 1fr 18px;align-items:center;gap:8px;font-size:11.5px;color:#5A6259}
.mb .bar{height:6px}
/* ---------- lists ---------- */
.nl{display:flex;gap:12px;padding:12px 10px;border-radius:12px;cursor:pointer;transition:background .12s}
.nl:hover{background:#F7F8F5}
.nl .tile{width:36px;height:36px;border-radius:10px}
.nl b{font-weight:500;font-size:13.5px;display:block}
.nl p{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nl .meta{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:11.5px;color:var(--muted)}
.unread{width:7px;height:7px;border-radius:50%;background:var(--lime);flex-shrink:0;margin-top:6px}
.t-urgent{background:var(--danger-soft);color:#A4483F}.t-warning{background:var(--warning-soft);color:#946A1B}.t-info{background:var(--sage-soft);color:var(--forest)}
.tl{position:relative;padding-left:4px}
.tl .it{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl .it:last-child{padding-bottom:0}
.tl .it::before{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:1px;background:var(--border)}
.tl .it:last-child::before{display:none}
.tl .tile{width:32px;height:32px;border-radius:50%}
.tl b{font-weight:500;font-size:13.5px}
.tl p{font-size:12.5px;color:var(--muted)}
.pr{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid #EEF0EB}
.pr:last-child{border-bottom:0}
.pr .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.om{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #EEF0EB}
.om:last-child{border-bottom:0}
.pp{display:grid;grid-template-columns:118px 1fr 34px;gap:10px;align-items:center;font-size:12.5px;padding:6px 0;cursor:pointer}
.pp .bar{height:10px;border-radius:6px}
.pp .bar i{border-radius:6px}
.seg{display:inline-flex;background:var(--track);padding:3px;border-radius:10px}
.seg button{height:28px;padding:0 11px;border-radius:8px;font-size:12.5px;color:var(--muted);font-weight:500}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chartwrap{position:relative}
.ttip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--pop);padding:9px 11px;font-size:12px;min-width:170px;display:none;z-index:5}
.ttip div{display:flex;justify-content:space-between;gap:12px}
/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;background:rgba(37,41,37,.32);display:grid;place-items:center;z-index:60;padding:16px;backdrop-filter:blur(1.5px)}
.modal{background:#fff;border-radius:18px;box-shadow:var(--pop);width:min(560px,100%);padding:22px;max-height:92vh;overflow:auto;animation:din2 .18s ease}
.modal.wide{width:min(860px,100%)}
@keyframes din2{from{opacity:0;transform:translateY(8px)}}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.mh h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;box-shadow:var(--pop);z-index:70;padding:22px;overflow:auto;animation:din .2s ease}
@keyframes din{from{transform:translateX(30px);opacity:0}}
.toasts{position:fixed;top:16px;right:16px;display:grid;gap:8px;z-index:95}
.toast{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--pop);padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:13px;min-width:280px;max-width:380px;animation:din2 .2s ease}
.toast svg.i{color:var(--forest)}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin:14px 0}
.dl .lbl{margin-bottom:3px}
.ck{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13.5px}
.ck:hover{background:#F7F8F5}
.ck .box2{width:20px;height:20px;border-radius:6px;border:1.5px solid #C9CFC6;display:grid;place-items:center;flex-shrink:0}
.ck.on .box2{background:var(--forest);border-color:var(--forest);color:#fff}
.ck.on span{color:var(--muted);text-decoration:line-through}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warning-soft);color:#6E5016;border-radius:12px;padding:12px 14px;font-size:13px}
/* ---------- enquiry & chat ---------- */
.pub{min-height:100vh;background:var(--canvas)}
.pubtop{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;max-width:1200px;margin:0 auto}
.pubhero{max-width:1200px;margin:0 auto 24px;padding:0 28px}
.pubhero .in{background:var(--hero);border-radius:24px;padding:40px;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}
.pubhero h1{font-size:34px;line-height:1.15;font-weight:600;letter-spacing:-.02em}
.opt{display:flex;gap:14px;background:#fff;border-radius:16px;padding:18px;border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s;width:100%}
.opt:hover{transform:translateY(-1px);box-shadow:var(--pop)}
.chat{max-width:820px;margin:0 auto;padding:0 28px 40px}
.msgs{display:grid;gap:12px;padding:18px;min-height:360px;max-height:58vh;overflow:auto}
.msg{max-width:78%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.5;animation:din2 .18s ease}
.bot{background:var(--sage-soft);border-top-left-radius:6px}
.usr{background:var(--forest);color:#fff;justify-self:end;border-top-right-radius:6px}
.qr{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 12px}
.qr button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:500;color:var(--forest-d)}
.qr button:hover{background:var(--sage-soft)}
.compose{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--border)}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--sage);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
.ans{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;max-width:100%;width:100%;animation:din2 .18s ease}
.fn{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);background:#F6F7F4;border:1px solid var(--border);border-radius:8px;padding:3px 8px;margin-bottom:10px}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
.mets>div{background:#F7F8F5;border-radius:12px;padding:12px}
/* ---------- assessment ---------- */
.stage{position:relative;border-radius:14px;overflow:hidden;background:#DDD8CC;aspect-ratio:4/3}
.stage img,.stage>svg.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage svg.ovl{position:absolute;inset:0;width:100%;height:100%}
.drop{border:1.5px dashed #C9CFC6;border-radius:14px;padding:22px;text-align:center;background:#FAFBF8;cursor:pointer}
.drop:hover{border-color:var(--forest);background:var(--sage-soft)}
.steps{display:grid;gap:8px;margin-top:12px}
.steps div{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.steps div.done{color:var(--ink)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--track);border-top-color:var(--forest);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lay{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lay label{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;background:#F6F7F4;border:1px solid var(--border);border-radius:999px;padding:4px 10px;cursor:pointer}
.conf{display:grid;grid-template-columns:1fr 70px 38px;gap:10px;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid #EEF0EB}
.conf .bar{height:6px}
/* ---------- quotation print ---------- */
.qdoc{border:1px solid var(--border);border-radius:12px;padding:26px;font-size:13px}
.qdoc table{width:100%;border-collapse:collapse;margin:14px 0}
.qdoc th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding:8px 6px;font-weight:500}
.qdoc td{padding:9px 6px;border-bottom:1px solid #EEF0EB}
.tot{margin-left:auto;width:min(320px,100%);display:grid;gap:6px}
.tot div{display:flex;justify-content:space-between}

 const u=ROLES[ROLE];
 let nav='';NAV.forEach((g,gi)=>{const items=g[1].filter(i=>allowed(i[0]));if(!items.length)return;nav+=(gi?'<div class="sep"></div>':'')+`<div class="grp">${g[0]}</div>`+items.map(i=>`<button class="nv${route===i[0]?' act':''}" data-go="${i[0]}" data-tip="${i[1]}" aria-label="${i[1]}">${I(i[2])}<span>${i[1]}</span></button>`).join('')});

 document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();const r=b.dataset.go;if(!allowed(r)){toast('Your role cannot access '+LABEL[r],'alert');return}go(r)}));

function drawRevenue(k){
 const el=document.getElementById('rchart');if(!el)return;const d=REV[k];const W=Math.max(el.clientWidth,300),H=250,pl=50,pr=12,pt=14,pb=28;const n=d.labels.length;
 const paid=d.rev.map((v,i)=>v-d.out[i]);const max=Math.max(...d.rev)*1.12;const step=max>1e6?5e5:max>3e5?1e5:max>1e5?5e4:2e4;const top=Math.ceil(max/step)*step;
 const x=i=>pl+(n===1?0:i*(W-pl-pr)/(n-1)),y=v=>pt+(H-pt-pb)*(1-v/top);
 let g='';for(let v=0;v<=top+1;v+=step){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#ECEEE9"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#858B84">${v>=1e5?'₹'+trim((v/1e5).toFixed(1))+'L':v?'₹'+v/1000+'k':'₹0'}</text>`}
 const bw=Math.min(26,(W-pl-pr)/n*.34);d.out.forEach((v,i)=>{g+=`<rect x="${x(i)-bw/2}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="4" fill="#E6C77F" opacity=".75"/>`});
 const line=a=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
 g+=`<path d="${line(d.rev)} L${x(n-1)} ${y(0)} L${x(0)} ${y(0)} Z" fill="url(#ra)"/><path d="${line(d.rev)}" fill="none" stroke="#55764D" stroke-width="2.2"/><path d="${line(paid)}" fill="none" stroke="#A8CE45" stroke-width="2.2" stroke-dasharray="1 0"/>`;
 d.labels.forEach((l,i)=>g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#858B84">${l}</text>`);
 el.innerHTML=`<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="ra" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#55764D" stop-opacity=".22"/><stop offset="1" stop-color="#55764D" stop-opacity="0"/></linearGradient></defs>${g}<line id="gl" y1="${pt}" y2="${y(0)}" stroke="#829B83" stroke-dasharray="3 3" style="display:none"/><circle id="gd1" r="4.5" fill="#fff" stroke="#55764D" stroke-width="2" style="display:none"/><circle id="gd2" r="4.5" fill="#fff" stroke="#A8CE45" stroke-width="2" style="display:none"/><rect id="hov" x="${pl}" y="0" width="${W-pl-pr}" height="${H}" fill="transparent"/></svg><div class="ttip" id="tt"></div>`;
 const hov=el.querySelector('#hov'),tt=el.querySelector('#tt'),gl=el.querySelector('#gl'),g1=el.querySelector('#gd1'),g2=el.querySelector('#gd2');
 hov.addEventListener('mousemove',e=>{const r=el.getBoundingClientRect();const mx=(e.clientX-r.left)*(W/r.width);let i=Math.round((mx-pl)/((W-pl-pr)/(n-1)));i=Math.max(0,Math.min(n-1,i));gl.setAttribute('x1',x(i));gl.setAttribute('x2',x(i));gl.style.display='';[g1,g2].forEach((c,j)=>{c.setAttribute('cx',x(i));c.setAttribute('cy',y(j?paid[i]:d.rev[i]));c.style.display=''});tt.innerHTML=`<b style="font-weight:600">${d.labels[i]}</b><div><span class="muted">Revenue</span><span class="num">${inr(d.rev[i])}</span></div><div><span class="muted">Payments received</span><span class="num">${inr(paid[i])}</span></div><div><span class="muted">Outstanding</span><span class="num">${inr(d.out[i])}</span></div>`;tt.style.display='block';const px=x(i)*r.width/W;tt.style.left=Math.min(px+12,r.width-190)+'px';tt.style.top='10px'});
 hov.addEventListener('mouseleave',()=>{tt.style.display='none';gl.style.display='none';g1.style.display='none';g2.style.display='none'});
}

{k:/install|this week|scheduled|schedule/i,m:'installations',fn:'get_installations_this_week',src:'Installations',a:()=>({t:'2 installations are scheduled this week (17–23 Nov).',tbl:[['Project','Customer','Date','Technician'],[['INS-201','Rahul Sharma · 3 kW','22 Nov','Suresh Kumar'],['INS-204','Kavita Deshmukh · 4 kW','23 Nov','Ramesh Yadav']]]})}
];
V.assistant=()=>`<div class="ph"><div><h1>SolarOS Intelligence</h1><p>Ask about projects, stock, sales and service. Answers come from authorized, read-only SolarOS functions that respect your role.</p></div><div class="acts"><span class="demo">Demo data</span>${CHAT.length?`<button class="btn btn-o" id="cnew">${I('plus')} New chat</button>`:''}</div></div>
 <section class="card" style="padding:0;overflow:hidden"><div class="msgs" id="msgs">${CHAT.length?'':`<div style="text-align:center;padding:30px 10px"><div class="tile" style="width:52px;height:52px;margin:0 auto;border-radius:16px;background:var(--lime-soft);color:#5A7613">${I('spark',24)}</div><h3 style="font-weight:600;margin-top:12px">How can I help, ${ROLES[ROLE][0].split(' ')[0]}?</h3><p class="cd" style="margin-top:4px">Try one of these questions</p></div>`}${CHAT.join('')}</div>
 <div class="qr">${SUGG.map(s=>`<button data-q="${esc(s)}">${s}</button>`).join('')}</div>
 <form class="compose" id="cf"><input class="inp" id="ci" placeholder="Ask SolarOS Intelligence…" autocomplete="off"/><button class="btn btn-p">${I('send')} Ask</button></form></section>`;
function ask(q){if(!q.trim())return;CHAT.push(`<div class="msg usr">${esc(q)}</div>`);CHAT.push('<div class="msg bot" id="typing"><span class="typing"><i></i><i></i><i></i></span></div>');render();
 setTimeout(()=>{CHAT.pop();const h=QA.find(x=>x.k.test(q));let html;
  if(!h)html=`<div class="ans"><p>I can answer questions about delayed projects, stock to replenish, pending quotations, monthly revenue, service tickets and this week’s installations.</p></div>`;
  else if(!allowed(h.m))html=`<div class="ans"><div class="fn">${I('shield',13)} ${h.fn} · refused</div><p>Your role (${ROLES[ROLE][1]}) doesn’t have access to ${LABEL[h.m]} data, so I can’t answer that. Ask a Director to share the report.</p></div>`;
  else{const a=h.a();html=`<div class="ans"><div class="fn">${I('zap',13)} Authorized function · ${h.fn} · read-only · Sources: ${h.src}</div><p style="font-weight:500">${a.t}</p>${a.tbl?`<div class="tw" style="margin:10px 0 0"><table class="tbl"><thead><tr>${a.tbl[0].map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${a.tbl[1].map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}${a.met?`<div class="mets">${a.met.map(m=>`<div><div class="lbl">${m[0]}</div><div class="stat" style="font-size:22px;margin-top:4px">${m[1]}</div><div class="cd">${m[2]}</div></div>`).join('')}</div>`:''}</div>`}
  CHAT.push(html);render();const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight},800)}
function bindAssistant(){document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));const f=document.getElementById('cf');if(f)f.onsubmit=e=>{e.preventDefault();const i=document.getElementById('ci');const v=i.value;i.value='';ask(v)};const n=document.getElementById('cnew');if(n)n.onclick=()=>{CHAT=[];render()};const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight}

/* ---------- customer enquiry (public, AI-first) ---------- */
let EQ={mode:null,slots:{},step:0,msgs:[],done:null,photos:0};
const SLOTS=[['name','What’s your name?'],['phone','Thanks, {name}! What’s the best mobile number to reach you?'],['city','Which city is the property in?'],['bill','Roughly how much is your monthly electricity bill (₹)?'],['roof','What type of roof do you have?',['RCC flat terrace','Sloped tiles','Metal sheet','Not sure']],['dims','Do you know your rooftop dimensions?',['Yes — about 30 × 40 ft','I don’t know my rooftop dimensions']],['photos','Would you like to share rooftop photos? They help our AI make a preliminary assessment.',['Upload photos','Skip for now']],['system','Any preference for the type of system?',['On-grid','Hybrid (with battery)','Off-grid','Not sure — recommend one']]];
const CITIES=['Pune','Mumbai','Nagpur','New Delhi','Delhi','Noida','Gurugram','Jaipur','Ahmedabad','Surat','Bengaluru','Bangalore','Mysuru','Hyderabad','Chennai','Coimbatore','Kochi','Lucknow','Indore','Bhopal','Kolkata','Chandigarh'];
function extract(t){const s=EQ.slots,low=t.toLowerCase();const ph=t.replace(/[\s-]/g,'').match(/(?:\+91)?(\d{10})/);if(ph&&!s.phone)s.phone=ph[1];
 const c=CITIES.find(c=>low.includes(c.toLowerCase()));if(c&&!s.city)s.city=c;
 const b=t.match(/(?:₹|rs\.?|inr|bill[^0-9]{0,20})\s*([\d,]{3,})/i);if(b&&!s.bill)s.bill=+b[1].replace(/,/g,'');
 const n=t.match(/(?:i am|i'm|im|my name is|this is)\s+([a-z]+(?:\s[a-z]+)?)/i);if(n&&!s.name)s.name=n[1].replace(/\b\w/g,x=>x.toUpperCase())}
function nextQ(){return SLOTS.find(([k])=>EQ.slots[k]===undefined)}
function botSay(text,chips){EQ.msgs.push({who:'bot',text,chips});}
function eqAnswer(text){if(!text.trim())return;EQ.msgs.push({who:'usr',text});const q=nextQ();extract(text);const s=EQ.slots;
 if(q&&s[q[0]]===undefined){const k=q[0];
  if(k==='name')s.name=text.trim().split(/\s+/).slice(0,3).join(' ').replace(/\b\w/g,x=>x.toUpperCase());
  else if(k==='phone'){botSay('That doesn’t look like a 10-digit mobile number — could you check it?');return eqRender()}
  else if(k==='city')s.city=text.trim().replace(/\b\w/g,x=>x.toUpperCase());
  else if(k==='bill'){const v=+text.replace(/[^\d]/g,'');if(!v){botSay('Please share an approximate amount in rupees, e.g. 4500.');return eqRender()}s.bill=v}
  else if(k==='dims'){if(/don/i.test(text)){s.dims='unknown';botSay('No problem — many customers don’t. Rooftop photos let our AI make a preliminary estimate, and a surveyor will verify measurements on site.')}else s.dims=text.replace(/^yes\s*—\s*/i,'')}
  else if(k==='photos'){if(/upload/i.test(text)){document.getElementById('eqf').click();s.photos='pending';return eqRender()}s.photos='skipped'}
  else s[k]=text}
 const n=nextQ();if(n){const skipped=SLOTS.filter(([k])=>EQ.slots[k]!==undefined).length;botSay(n[1].replace('{name}',(s.name||'').split(' ')[0]),n[2]);if(q&&q[0]!==n[0]&&skipped>SLOTS.indexOf(q)+1)EQ.msgs.splice(EQ.msgs.length-1,0,{who:'bot',text:'Got it — I’ve noted '+['phone','city','bill'].filter(k=>s[k]&&k!==q[0]).map(k=>k==='bill'?'your bill':'your '+k).join(' and ')+', so I’ll skip those questions.'})}else summary();eqRender()}
function estimate(){const s=EQ.slots;const kwh=(s.bill||4000)/7.5;const kw=Math.max(1,Math.round(kwh*12/(365*5.1*.82)*2)/2);const panels=Math.ceil(kw*1000/545),gen=Math.round(panels*.545*5.1*365*.82),sav=Math.round(Math.min(gen,kwh*12)*7.5),sub=kw>=3?78000:kw>=2?60000:30000;return{kw,panels,gen,sav,sub}}
function summary(){EQ.msgs.push({who:'sum'})}
function eqRender(){const el=document.getElementById('eqmsgs');if(!el)return render();const s=EQ.slots;
 el.innerHTML=EQ.msgs.map(m=>m.who==='sum'?(()=>{const e=estimate();return `<div class="ans"><div class="fn">${I('spark',13)} Preliminary estimate · demonstration</div><p style="font-weight:500">Here’s a summary of your answers, ${(s.name||'').split(' ')[0]}.</p><div class="dl" style="margin:10px 0">${[['Name',s.name],['Mobile',s.phone],['City',s.city],['Monthly bill',inr(s.bill)],['Roof',s.roof],['Dimensions',s.dims==='unknown'?'Not known — AI + site survey':s.dims],['Photos',s.photos==='skipped'?'Skipped':EQ.photos+' uploaded'],['System preference',s.system]].map(([l,v])=>`<div><div class="lbl">${l}</div>${esc(v||'—')}</div>`).join('')}</div><div class="mets">${[['Suggested size',e.kw+' kW'],['Panels (545 W)',e.panels],['Generation / yr',e.gen.toLocaleString('en-IN')+' kWh'],['Savings / yr',lakh(e.sav)]].map(m=>`<div><div class="lbl">${m[0]}</div><div class="stat" style="font-size:20px;margin-top:4px">${m[1]}</div></div>`).join('')}</div><p class="cd" style="margin-top:10px">Indicative PM Surya Ghar subsidy ${inr(e.sub)} (subject to DISCOM approval). Final design follows a site survey.</p><div class="acts" style="margin-top:12px"><button class="btn btn-p" id="eqsub">${I('send')} Submit enquiry</button><button class="btn btn-o" id="eqedit">Edit answers</button></div></div>`})():`<div class="msg ${m.who==='bot'?'bot':'usr'}">${esc(m.text)}</div>`).join('');
 const last=EQ.msgs[EQ.msgs.length-1];document.getElementById('eqchips').innerHTML=last&&last.who==='bot'&&last.chips?last.chips.map(c=>`<button data-c="${esc(c)}">${c}</button>`).join(''):'';
 document.querySelectorAll('#eqchips [data-c]').forEach(b=>b.onclick=()=>eqAnswer(b.dataset.c));
 const sb=document.getElementById('eqsub');if(sb)sb.onclick=submitEnquiry;const ed=document.getElementById('eqedit');if(ed)ed.onclick=()=>{EQ.mode='form';render()};
 el.scrollTop=el.scrollHeight}
function submitEnquiry(){const s=EQ.slots,e=estimate();const id='LD-'+(1064+LEADS.length);LEADS.unshift({id,name:s.name||'Website visitor',city:s.city||'—',phone:'+91 '+(s.phone||'0000000000').replace(/(\d{5})(\d{5})/,'$1 $2'),bill:s.bill||0,kw:e.kw,status:'new',rep:'Priya Sharma',source:EQ.mode==='form'?'Website form':'Website — AI assessment',date:new Date().toISOString().slice(0,10)});
 NOTIFS.unshift({t:'New AI enquiry received',d:(s.name||'A customer')+' · '+(s.city||'')+' · est. '+e.kw+' kW · '+(s.photos==='skipped'?'no photos':'photos attached'),p:'info',ic:'spark',ts:new Date().toISOString(),go:'leads',read:false});ACT.unshift(['New customer registered',(s.name||'A customer')+' submitted an enquiry from '+(s.city||'the website'),'users',new Date().toISOString()]);
 EQ.done='ENQ-2026-0'+(400+LEADS.length);render()}
V.enquiry=()=>{const s=EQ.slots;
 if(EQ.done)return `<div class="chat" style="padding-top:20px"><section class="card" style="text-align:center;padding:40px 24px"><div class="tile" style="width:60px;height:60px;margin:0 auto;border-radius:18px;background:var(--success-soft);color:#3F7A48">${I('checkc',30)}</div><h2 style="font-size:24px;font-weight:600;margin-top:16px">Thank you, ${esc((s.name||'').split(' ')[0])}!</h2><p class="muted" style="margin:8px auto 0;max-width:460px">Your enquiry <b class="mono" style="color:var(--ink)">${EQ.done}</b> has been received. A SolarOS advisor will call you within 24 hours to schedule a free site survey.</p><div class="acts" style="justify-content:center;margin-top:20px"><button class="btn btn-p" id="eqlead">${I('userPlus')} View lead in SolarOS</button><button class="btn btn-o" id="eqnew">Start a new enquiry</button></div></section></div>`;
 if(EQ.mode==='ai')return `<div class="chat"><section class="card" style="padding:0;overflow:hidden"><div class="ch" style="padding:16px 18px 0;margin:0"><div class="tile" style="background:var(--lime-soft);color:#5A7613">${I('bot',16)}</div><div class="grow"><div class="ct">SolarOS assistant</div><div class="cd">Asks only for what’s missing · ${SLOTS.filter(([k])=>s[k]!==undefined).length}/${SLOTS.length} answered</div></div><button class="btn btn-g btn-sm" id="eqform">Switch to form</button></div><div class="msgs" id="eqmsgs"></div><div class="qr" id="eqchips"></div><form class="compose" id="eqc"><input class="inp" id="eqi" placeholder="Type your answer… (try: I'm Rahul from Pune, bill around ₹4500)" autocomplete="off"/><button class="btn btn-p">${I('send')}</button></form><input type="file" id="eqf" accept="image/*" multiple hidden/></section></div>`;
 if(EQ.mode==='form')return `<div class="chat"><section class="card"><div class="mh"><div><h3>Solar assessment form</h3><div class="cd">Your answers are kept if you switch back to the assistant.</div></div><button class="btn btn-g btn-sm" id="eqai">${I('bot',15)} Use AI assistant</button></div><form id="eqfrm" novalidate>
  <div class="lbl" style="margin:4px 0 10px">Contact</div><div class="two"><div class="field"><label>Full name *</label><input class="inp" name="name" value="${esc(s.name||'')}"/><div class="err"></div></div><div class="field"><label>Mobile *</label><input class="inp" name="phone" value="${esc(s.phone||'')}"/><div class="err"></div></div></div>
  <div class="lbl" style="margin:8px 0 10px">Property & electricity</div><div class="two"><div class="field"><label>City *</label><input class="inp" name="city" value="${esc(s.city||'')}"/><div class="err"></div></div><div class="field"><label>Monthly bill (₹) *</label><input class="inp" name="bill" inputmode="numeric" value="${s.bill||''}"/><div class="err"></div></div></div>
  <div class="two"><div class="field"><label>Roof type</label><select class="inp" name="roof">${SLOTS[4][2].map(o=>`<option ${s.roof===o?'selected':''}>${o}</option>`).join('')}</select></div><div class="field"><label>System preference</label><select class="inp" name="system">${SLOTS[7][2].map(o=>`<option ${s.system===o?'selected':''}>${o}</option>`).join('')}</select></div></div>
  <label class="ck" style="padding-left:0"><input type="checkbox" name="nodim" ${s.dims==='unknown'?'checked':''}/> I don’t know my rooftop dimensions</label>
  <div class="acts" style="justify-content:flex-end;margin-top:10px"><button class="btn btn-p">Review summary</button></div></form></section></div>`;
 return `<section class="pubhero"><div class="in"><div><span class="bc" style="display:inline-flex;gap:6px;align-items:center;font-size:12.5px;background:rgba(255,255,255,.5);padding:4px 10px;border-radius:999px">${I('sun',14)} Free solar assessment</span><h1 style="margin:14px 0 10px">Let’s find the right solar solution for your property.</h1><p style="color:#4A5449;font-size:15px;max-width:520px">Tell us about your home or business. SolarOS will help assess your rooftop and recommend a suitable solar system.</p>
  <div style="display:grid;gap:12px;margin-top:22px;max-width:520px"><button class="opt" id="eqstartai"><div class="tile" style="width:42px;height:42px;background:var(--lime-soft);color:#5A7613">${I('bot',20)}</div><div><b style="font-weight:500;font-size:15px">Start with AI Assistant</b><p class="cd" style="margin-top:2px">A friendly chat that asks only what it needs — about 2 minutes.</p></div></button><button class="opt" id="eqstartform"><div class="tile" style="width:42px;height:42px">${I('form',20)}</div><div><b style="font-weight:500;font-size:15px">Complete solar assessment form</b><p class="cd" style="margin-top:2px">Prefer forms? Fill in the details at your own pace.</p></div></button></div></div>
  <div>${heroSVG()}</div></div></section>`};
function bindEnquiry(){const q=id=>document.getElementById(id);
 if(q('eqstartai'))q('eqstartai').onclick=()=>{EQ.mode='ai';if(!EQ.msgs.length)botSay('Hi! I’m the SolarOS assistant. I’ll ask a few quick questions to estimate the right solar system for you. What’s your name?');render()};
 if(q('eqstartform'))q('eqstartform').onclick=()=>{EQ.mode='form';render()};
 if(q('eqform'))q('eqform').onclick=()=>{EQ.mode='form';render()};if(q('eqai'))q('eqai').onclick=()=>{EQ.mode='ai';if(!EQ.msgs.length)botSay('Hi! What’s your name?');render()};
 if(q('eqmsgs'))eqRender();
 if(q('eqc'))q('eqc').onsubmit=e=>{e.preventDefault();const v=q('eqi').value;q('eqi').value='';eqAnswer(v)};
 if(q('eqf'))q('eqf').onchange=e=>{const n=e.target.files.length;if(!n){EQ.slots.photos='skipped'}else{EQ.photos=n;EQ.slots.photos='uploaded';EQ.msgs.push({who:'usr',text:'📷 '+n+' photo'+(n>1?'s':'')+' uploaded'.replace('📷 ','')})}const nx=nextQ();if(nx)botSay(nx[1],nx[2]);else summary();eqRender()};
 if(q('eqfrm'))q('eqfrm').onsubmit=e=>{e.preventDefault();const f=e.target;let ok=true;const er=(n,m)=>{f[n].parentElement.querySelector('.err').textContent=m;if(m)ok=false};
  er('name',f.name.value.trim().length<2?'Enter your name':'');er('phone',/^\d{10}$/.test(f.phone.value.replace(/\D/g,'').slice(-10))&&f.phone.value.replace(/\D/g,'').length>=10?'':'Enter a valid 10-digit mobile number');er('city',f.city.value.trim()?'':'City is required');er('bill',+f.bill.value>0?'':'Enter your monthly bill');if(!ok)return;
  Object.assign(EQ.slots,{name:f.name.value.trim(),phone:f.phone.value.replace(/\D/g,'').slice(-10),city:f.city.value.trim(),bill:+f.bill.value,roof:f.roof.value,system:f.system.value,dims:f.nodim.checked?'unknown':(EQ.slots.dims&&EQ.slots.dims!=='unknown'?EQ.slots.dims:'Provided on site'),photos:EQ.slots.photos||'skipped'});
  EQ.mode='ai';EQ.msgs=EQ.msgs.filter(m=>m.who!=='sum');summary();render()};
 if(q('eqlead'))q('eqlead').onclick=()=>{const l=LEADS[0];EQ={mode:null,slots:{},step:0,msgs:[],done:null,photos:0};go('leads');setTimeout(()=>leadDrawer(l),50)};
 if(q('eqnew'))q('eqnew').onclick=()=>{EQ={mode:null,slots:{},step:0,msgs:[],done:null,photos:0};render()}}

/* ---------- login ---------- */
function login(){closeAll();closePops();route='login';location.hash='/login';render()}
V.login=()=>`<div style="min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr" class="lg"><section style="background:var(--hero);padding:36px 44px;display:flex;flex-direction:column;justify-content:space-between;gap:24px"><div style="display:flex;gap:10px;align-items:center">${LOGO}<b style="font-size:18px;font-weight:600">Solar<span style="color:var(--forest)">OS</span></b></div><div><h1 style="font-size:32px;line-height:1.15;font-weight:600;letter-spacing:-.02em;max-width:460px">Run your entire solar business — from rooftop to revenue.</h1><div style="max-width:520px;margin-top:16px">${heroSVG()}</div></div><div class="cd" style="color:#4A5449">AI rooftop assessment · engineering-rule sizing · GST quotations · installation tracking</div></section>
 <section style="display:grid;place-items:center;padding:28px"><div style="width:min(400px,100%)"><h2 style="font-size:24px;font-weight:600;letter-spacing:-.01em">Sign in</h2><p class="cd" style="margin:4px 0 20px">Welcome back to SolarOS.</p><form id="lgf"><div class="field"><label>Email</label><input class="inp" name="email" value="rajesh@solaros.in"/></div><div class="field"><label>Password</label><input class="inp" type="password" name="pw" value="demo1234"/><div class="err"></div></div><button class="btn btn-p" style="width:100%;height:40px">Sign in</button></form>
 <div class="lbl" style="margin:22px 0 8px">Demo accounts</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">${Object.entries(ROLES).map(([k,v])=>`<button class="btn btn-o btn-sm" data-lr="${k}">${v[1].split(' ')[0]}</button>`).join('')}</div><p class="cd" style="margin-top:16px">Demo sign-in. Production authentication will use the SolarOS backend.</p></div></section></div>
 <style>@media(max-width:860px){.lg{grid-template-columns:1fr!important}}</style>`;
function bindLogin(){document.getElementById('lgf').onsubmit=e=>{e.preventDefault();if(e.target.pw.value.length<6){e.target.pw.parentElement.querySelector('.err').textContent='Password must be at least 6 characters';return}ROLE='admin';toast('Signed in as Rajesh Khanna (Director)');go('dashboard')};document.querySelectorAll('[data-lr]').forEach(b=>b.onclick=()=>{ROLE=b.dataset.lr;toast('Signed in as '+ROLES[ROLE][0]+' ('+ROLES[ROLE][1]+')');go('dashboard')})}

/* ---------- render ---------- */
function render(){
 const root=document.getElementById('root');document.body.classList.toggle('sb-open',sbOpen&&innerWidth>=768);
 if(route==='login'){root.innerHTML=V.login();bindLogin();return}
 if(route==='enquiry'){root.innerHTML=`<div class="pub"><header class="pubtop"><div style="display:flex;gap:10px;align-items:center">${LOGO}<b style="font-size:17px;font-weight:600">Solar<span style="color:var(--forest)">OS</span></b></div><div class="acts"><span class="demo hide-sm">Demo</span><a class="btn btn-o btn-sm" href="#/dashboard" data-go="dashboard">Staff portal</a></div></header>${V.enquiry()}</div>`;root.querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{e.preventDefault();go(b.dataset.go)});bindEnquiry();return}
 if(!allowed(route))route='dashboard';
 const content=V[route]?V[route]():MOD[route]?modView(route):V.dashboard();
 root.innerHTML=shell(content);bindShell();
 if(route==='dashboard'){drawRevenue(window._rk||'monthly');document.querySelectorAll('#rseg button').forEach(b=>b.onclick=()=>{window._rk=b.dataset.k;document.querySelectorAll('#rseg button').forEach(x=>x.classList.toggle('on',x===b));drawRevenue(b.dataset.k)});document.querySelectorAll('[data-lead]').forEach(r=>r.onclick=()=>leadDrawer(LEADS.find(l=>l.id===r.dataset.lead)));document.querySelectorAll('[data-inst]').forEach(r=>r.onclick=()=>instDrawer(INST.find(x=>x.id===r.dataset.inst)));bindNotifs(document.getElementById('dnot'))}
 if(route==='leads'){leadsTable();document.getElementById('lq').oninput=e=>{LQ.q=e.target.value;LQ.pg=0;leadsTable()};document.getElementById('lst').onchange=e=>{LQ.st=e.target.value;LQ.pg=0;leadsTable()};document.getElementById('addl').onclick=addLead;document.getElementById('lcsv').onclick=()=>csv('solaros-leads',['Lead ID','Customer','City','Phone','Monthly bill','Est. kW','Status','Salesperson','Source','Created'],LEADS.map(l=>[l.id,l.name,l.city,l.phone,l.bill,l.kw,ST[l.status][0],l.rep,l.source,l.date]))}
 if(route==='assessment')bindAssessment();
 if(route==='assistant')bindAssistant();
 if(route==='settings')bindSettings();
 if(route==='monitoring')document.getElementById('mconn').onclick=()=>{const o=modal(`<div class="mh"><div><h3>Connect inverter telemetry</h3><div class="cd">Real data only — SolarOS never simulates live output.</div></div><button class="ib" data-x aria-label="Close">${I('x')}</button></div><ol style="padding-left:18px;display:grid;gap:8px;font-size:13.5px"><li>Enable the inverter’s Wi-Fi/4G data logger at commissioning.</li><li>Add the manufacturer cloud API credentials in the SolarOS backend (server-side only).</li><li>SolarOS ingests readings (power, DC voltage/current, temperature) every 5 minutes.</li><li>Anomaly detection flags under-performance and faults automatically.</li></ol><div class="acts" style="justify-content:flex-end;margin-top:16px"><button class="btn btn-p" data-x>Got it</button></div>`);o.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>o.remove())};
 if(MOD[route]&&!V[route])bindMod(route);
}
addEventListener('resize',()=>{if(route==='dashboard')drawRevenue(window._rk||'monthly')});
route=(location.hash.replace('#/','')||'dashboard');render();
</script>
</body>
</html>
